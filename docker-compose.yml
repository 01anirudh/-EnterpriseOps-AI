version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: enterpriseops_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-enterpriseops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enterpriseops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-enterpriseops}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterpriseops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: enterpriseops_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: enterpriseops_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
